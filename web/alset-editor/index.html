<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alset-JS Editor · Runtime nativo</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>
  <header class="top">
    <div class="brand">ALSET-JS <small>Runtime Editor</small></div>
    <input id="app-name" class="name" value="mi-app-js" spellcheck="false" title="Nombre ANS" />
    <div class="devices" role="group" aria-label="Dispositivo">
      <button type="button" class="dev active" data-d="mobile">Móvil</button>
      <button type="button" class="dev" data-d="tablet">Tablet</button>
      <button type="button" class="dev" data-d="desktop">Desktop</button>
      <button type="button" class="dev" data-d="watch">Watch</button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="btn ghost" id="btn-examples">Ejemplos</button>
    <button type="button" class="btn ghost" id="btn-run">Ejecutar</button>
    <button type="button" class="btn gold" id="btn-deploy">Desplegar</button>
    <a class="btn ghost" href="/" title="Volver a Studio">Studio</a>
  </header>

  <div class="workspace">
    <aside class="toolbox">
      <h3>Componentes</h3>
      <div id="toolbox"></div>
      <h3>Plantillas</h3>
      <div id="templates"></div>
      <h3>Iconos</h3>
      <div id="icons" class="icons"></div>
    </aside>

    <section class="code-col">
      <div class="label">Código Alset-JS (genera la UI)</div>
      <textarea id="code" spellcheck="false"></textarea>
      <div class="status-bar">
        <span id="status">Listo</span>
        <span id="hint">Define <code>function App()</code> que devuelva el árbol</span>
      </div>
    </section>

    <section class="preview-col">
      <div class="label">Preview · <span id="dev-label">Móvil 390×720</span></div>
      <div id="preview-host" class="preview-host">
        <div id="device-frame" class="device-frame mobile">
          <div id="preview" class="preview-root"></div>
        </div>
      </div>
      <div class="label">Estados vivos</div>
      <pre id="states-out" class="states-out">—</pre>
    </section>
  </div>

  <aside id="examples-drawer" class="drawer" hidden>
    <div class="drawer-panel">
      <header>
        <strong>Ejemplos Alset-JS</strong>
        <button type="button" class="btn ghost" id="btn-close-ex">Cerrar</button>
      </header>
      <div id="examples-list"></div>
    </div>
  </aside>

  <script type="module" src="./main.js"></script>
</body>
</html>
