<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alset Studio No-Code</title>
  <link rel="stylesheet" href="/css/studio.css" />
</head>
<body>
  <header class="top">
    <div class="brand">ALSET STUDIO <small>sandbox · no-code · PWA · RootCID</small></div>
    <input id="app-name" value="mi-app" class="name-input" />
    <span id="status" class="badge">listo</span>
    <div class="spacer"></div>
    <button type="button" class="btn btn-ghost" id="btn-clear-preview">Limpiar preview</button>
    <button type="button" class="btn btn-ghost" id="btn-clear">Limpiar canvas</button>
    <button type="button" class="btn btn-blue" id="btn-export">Export .alset</button>
    <button type="button" class="btn btn-gold" id="btn-deploy">Desplegar PWA</button>
  </header>

  <div id="error-box" class="error-box hidden" role="alert"></div>

  <div class="main">
    <aside class="col">
      <h3>Plantillas</h3>
      <div id="templates" class="templates"></div>
      <h3>Toolbox</h3>
      <div id="toolbox" class="toolbox"></div>
      <h3>Colores tema</h3>
      <div id="colors" class="colors"></div>
    </aside>

    <section class="col canvas-wrap">
      <h3>Canvas</h3>
      <div id="canvas"></div>
      <div class="preview-bar">
        <h3>Preview vivo</h3>
        <div id="devices" class="devices"></div>
      </div>
      <div id="preview" class="preview-area"></div>
    </section>

    <aside class="col">
      <h3>Propiedades</h3>
      <div id="props" class="props"></div>
      <h3>LispAI (set-prop seguro)</h3>
      <textarea id="lisp" class="lisp" spellcheck="false"></textarea>
      <div class="row-btns">
        <button type="button" class="btn btn-blue" id="btn-apply-lisp">Aplicar Lisp</button>
        <button type="button" class="btn btn-ghost" id="btn-sync-lisp">Sync desde árbol</button>
      </div>
    </aside>
  </div>

  <div class="bottom">
    <section>
      <h3>App JSON</h3>
      <pre id="appjson"></pre>
    </section>
    <section>
      <h3>Consola</h3>
      <pre id="console"></pre>
    </section>
  </div>

  <script type="module">
    import { bootBuilder } from '/studio/builder.js';
    bootBuilder();
  </script>
</body>
</html>
